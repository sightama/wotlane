<!doctype html>
<!-- ABOUTME: The browser version's page: the front panel (single player, or host or join an online lobby), the game canvas, a status -->
<!-- ABOUTME: line and the log (L button). boot.js sets up the Emscripten module; front.js runs the panel and loads the game on a choice. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War of the Monsters</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e0592a'/%3E%3Ctext x='8' y='12' font-size='10' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3EW%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg: #0b0b0d; --panel: #16161a; --fg: #d8d8dc; --dim: #7a7a82; --accent: #e0592a; --line: #2a2a30; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  /* the canvas fills the page (the game letterboxes its own frame); the bar floats in a corner */
  #stage { position: fixed; inset: 0; }
  #canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
  #screen { position: absolute; inset: 0; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--fg); font-size: 18px; pointer-events: none; }
  #stall { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; text-align: center; background: rgba(11, 11, 13, .94); }
  #stall .row { justify-content: center; margin-top: 8px; }
  #stage:fullscreen #bar { display: none; }
  #bar { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 12px; align-items: center; color: var(--dim); font-size: 12px;
         padding: 4px 8px; border-radius: 6px; background: rgba(11, 11, 13, .7); opacity: .5; transition: opacity .2s; }
  #bar:hover, #bar:focus-within { opacity: 1; }
  button { background: none; border: 1px solid var(--dim); color: var(--fg); border-radius: 4px; padding: 2px 8px; cursor: pointer; font: inherit; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.main { background: var(--accent); border-color: var(--accent); color: #fff; padding: 8px 16px; font-weight: 600; }
  #log { display: none; position: fixed; inset: auto 0 0 0; height: 35vh; overflow: auto; margin: 0; padding: 8px;
         background: rgba(0, 0, 0, .85); font: 11px/1.3 ui-monospace, monospace; white-space: pre-wrap; }
  #log.open { display: block; }
  #front { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11, 11, 13, .92); padding: 16px; }

  .card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px;
          display: grid; gap: 14px; }
  .card h1 { margin: 0; font-size: 20px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { color: var(--dim); font-size: 12px; display: grid; gap: 4px; }
  input, select { background: #0e0e11; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
  #joinCode { width: 6em; text-transform: uppercase; letter-spacing: .2em; }
  #code { font: 700 28px/1 ui-monospace, monospace; letter-spacing: .25em; color: var(--accent); }
  #members { margin: 0; padding-left: 18px; }
  #frontMsg { color: var(--dim); min-height: 1.4em; margin: 0; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div id="screen"><canvas id="canvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas><div id="loading" hidden></div>
    <div id="stall" hidden><p id="stallText"></p><p id="stallNote">The match is paused until they are back.</p>
      <div class="row"><button id="keepWaiting" class="main">Keep waiting</button><button id="leaveMatch">Leave the match</button></div></div></div>
  <div id="bar"><span id="status">Choose how to play</span><button id="fullscreen" title="Fullscreen">Fullscreen</button>
    <button id="logToggle" title="Show the log">L</button></div>
</div>
<div id="front">
  <div class="card">
    <h1>War of the Monsters</h1>
    <div class="row">
      <label>Name <input id="name" maxlength="16" autocomplete="nickname"></label>
      <label>Monster <select id="monster"></select></label>
    </div>
    <div id="choose" class="card" style="padding:0;border:0">
      <div class="row"><button id="single" class="main">Single player</button></div>
      <hr>
      <div class="row"><button id="host">Host online</button>
        <span style="color:var(--dim)">or</span>
        <input id="joinCode" maxlength="4" placeholder="CODE" aria-label="Lobby code"><button id="join">Join</button></div>
    </div>
    <div id="inLobby" hidden style="display:grid;gap:12px">
      <div class="row">Lobby code <span id="code"></span></div>
      <ul id="members"></ul>
      <div id="ownerOnly" class="row">
        <label>Stage <select id="lobbyStage"></select></label>
        <label>Wins <select id="wins"></select></label>
        <label><span><input type="checkbox" id="mod_jump"> Jump <input type="checkbox" id="mod_fast"> Fast
          <input type="checkbox" id="mod_turbo"> Turbo</span></label>
        <button id="start" class="main">Start</button>
      </div>
      <p id="guestSettings" style="margin:0;color:var(--dim)"></p>
      <div class="row"><button id="leave">Leave</button></div>
    </div>
    <p id="frontMsg"></p>
  </div>
</div>
<pre id="log"></pre>
<script src="support.js"></script>
<script src="loading.js"></script>
<script src="stall.js"></script>
<script src="boot.js"></script>
<script type="module" src="front.js"></script>
</body>
</html>
