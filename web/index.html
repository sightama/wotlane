<!doctype html>
<!-- ABOUTME: The browser version's page: the game canvas, a status line and the log (toggled with the L button). -->
<!-- ABOUTME: boot.js sets up the Emscripten module (arguments, environment) before wotm.js loads the game. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>War of the Monsters</title>
<style>
  :root { --bg: #0b0b0d; --fg: #d8d8dc; --dim: #7a7a82; --accent: #e0592a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 8px; }
  #canvas { display: block; width: min(100vw, calc((100vh - 48px) * 640 / 448)); aspect-ratio: 640 / 448; background: #000; outline: none; }
  #bar { display: flex; gap: 12px; align-items: center; color: var(--dim); font-size: 12px; }
  #bar button { background: none; border: 1px solid var(--dim); color: var(--fg); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #log { display: none; position: fixed; inset: auto 0 0 0; height: 35vh; overflow: auto; margin: 0; padding: 8px;
         background: rgba(0, 0, 0, .85); font: 11px/1.3 ui-monospace, monospace; white-space: pre-wrap; }
  #log.open { display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="bar"><span id="status">Loading</span><button id="logToggle" title="Show the log">L</button></div>
</div>
<pre id="log"></pre>
<script src="boot.js"></script>
<script src="wotm.js"></script>
</body>
</html>
