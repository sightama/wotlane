<!doctype html><meta charset=utf-8><link rel=stylesheet href=_base.css>
<div class=tag>PROPOSED: one primary action, online grouped, 44px targets, AA contrast</div>
<div class=card>
<h1>War of the Monsters</h1>
<label>Name<input value="" aria-label="Name"></label>
<label>Monster<select><option>Preytor</option></select></label>
<button class=main style="width:100%;min-height:52px;font-size:18px">Play single player</button>
<div class=sec><h2>Play online</h2>
<div class=row><button>Host a lobby</button><span style="color:var(--dim)">or join</span></div>
<div class=row><input placeholder="CODE" style="width:7em;letter-spacing:.2em" aria-label="Lobby code"><button>Join</button></div>
<div class=row style="justify-content:space-between"><span style="color:var(--dim)">Open lobbies</span><button>Refresh</button></div>
<p style="margin:0;color:var(--dim)">No open lobbies. Host one and send the invite link.</p></div>
<div class=row style="justify-content:space-between"><button>Settings</button></div>
<p style="margin:0;color:var(--dim);font-size:13px">Works in Chrome, Firefox and Edge on a computer, and in Chrome on an Android phone.</p>
</div>
